<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Флаш карти – HTML редактори и авторски права</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#17244b;background:#f4f7ff}body{margin:0}.wrap{max-width:850px;margin:30px auto;padding:18px}h1{text-align:center;font-size:clamp(23px,4vw,34px)}.sub{text-align:center;color:#56617a}.toolbar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:24px 0}select,button{font:inherit;border-radius:12px;padding:12px 18px;border:1px solid #b9c5e4;background:white;cursor:pointer}button.primary{background:#354fbd;color:white;border-color:#354fbd}button:focus-visible,select:focus-visible,.card:focus-visible{outline:3px solid #ffab2f;outline-offset:3px}.card{border:3px solid #6571dc;background:linear-gradient(145deg,#fff,#e9edff);border-radius:24px;min-height:280px;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;cursor:pointer;box-shadow:0 12px 30px #2337791c}.card.answer{background:linear-gradient(145deg,#f3fff4,#dff8e6);border-color:#45a866}.cardtext{font-weight:750;font-size:clamp(22px,3.5vw,31px);line-height:1.4}.tag{font-size:14px;color:#59688c;margin-bottom:18px}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:22px 0}.stats{text-align:center;font-weight:600}.progress{height:12px;background:#dbe1f4;border-radius:20px;overflow:hidden;margin:16px auto;max-width:500px}.progress>div{height:100%;background:#44aa75;width:0}.foot{text-align:center;color:#66708a;font-size:14px}</style></head><body><main class="wrap"><h1>Флаш карти: HTML редактори, шаблони и авторски права</h1><p class="sub">30 въпроса • Натисни картата, за да видиш отговора</p><div class="toolbar"><label>Раздел: <select id="topic"><option value="all">Всички раздели</option><option value="0">HTML редактори</option><option value="1">HTML шаблони</option><option value="2">Авторски права и Creative Commons</option><option value="3">GNU GPL</option></select></label><button id="shuffle">Разбъркай</button><button id="reset">Започни отначало</button></div><div class="stats" id="stats"></div><div class="progress"><div id="bar"></div></div><div class="card" id="card" role="button" tabindex="0" aria-label="Обърни картата"><div><div class="tag" id="side"></div><div class="cardtext" id="cardtext"></div></div></div><div class="controls"><button id="prev">← Предишна</button><button class="primary" id="flip">Покажи отговора</button><button id="next">Следваща →</button></div><div class="controls"><button id="known">✓ Знам</button><button id="unknown">✕ Не знам</button></div><p class="foot">Работи без интернет. Отбелязванията важат за текущото отваряне на файла.</p></main><script>
const cards=[["Какво представлява HTML редакторът?", "Софтуерно приложение за създаване и редактиране на уеб страници."], ["Кои са двата основни вида HTML редактори?", "Текстови и визуални редактори."], ["За какво се използват текстовите редактори?", "За ръчно въвеждане и редактиране на HTML код."], ["Посочи три текстови HTML редактора.", "Visual Studio Code, Notepad++ и Bluefish Editor."], ["Какво представляват визуалните HTML редактори?", "Редактори за създаване на страници чрез визуална работна среда."], ["Посочи три визуални HTML редактора.", "BlueGriffon, Dreamweaver и SeaMonkey Composer."], ["Какво означава WYSIWYG?", "What You See Is What You Get – виждаш това, което получаваш."], ["Какво представлява режимът Dual View?", "Едновременно показва HTML кода и визуалния изглед на страницата."], ["Кой режим е подходящ за ръчно писане на HTML?", "Режим Source – показва HTML кода."], ["За какво служи Print Preview?", "За предварителен преглед на страницата преди печат."], ["Какво представляват HTML шаблоните?", "Предварително създадени уеб страници или части от тях."], ["Кое е основното предимство на HTML шаблоните?", "Спестяват време и улесняват създаването на сайтове."], ["Какви елементи може да съдържа един шаблон?", "Лого, менюта, изображения, панели, колонтитули и стилове."], ["Може ли HTML шаблон да се променя?", "Да, текстовете, изображенията, цветовете и оформлението могат да се редактират."], ["Къде се използват HTML шаблоните?", "Във визуални редактори и системи за управление на съдържанието (CMS)."], ["Посочи две системи за управление на съдържанието.", "WordPress и Joomla."], ["Посочи два сайта с готови шаблони.", "Canva.com и Wix.com."], ["Защо трябва да спазваме авторските права?", "За да защитаваме труда на авторите и да използваме законно произведенията им."], ["Какво трябва да посочим при използване на чужд материал?", "Автора и източника, когато това се изисква от лиценза."], ["Какво представлява Creative Commons?", "Организация, създала стандартни публични лицензи за използване на произведения."], ["Какво означава лицензът CC BY?", "Използване и промяна, включително с търговска цел, с посочване на автора."], ["Какво означава CC BY-SA?", "Посочване на автора и споделяне на промените под същия лиценз."], ["Какво означава CC BY-NC?", "Посочване на автора и използване само за нетърговски цели."], ["Какво означава CC BY-ND?", "Посочване на автора; споделяне само без промени."], ["Какво означава CC BY-NC-SA?", "Нетърговска употреба, посочване на автора и същия лиценз за промените."], ["Какво означава CC BY-NC-ND?", "Само нетърговско споделяне без промени и с посочване на автора."], ["Какво означава GNU GPL?", "GNU General Public License – Общ публичен лиценз на ГНУ."], ["Кои са основните свободи на GNU GPL?", "Използване, изучаване, промяна и разпространение на програмата."], ["Защо е важен достъпът до изходния код?", "Позволява изучаване, промяна и подобряване на програмата."], ["Как GNU GPL подпомага свободния софтуер?", "Позволява съвместна разработка и споделяне на подобренията при условията на лиценза."]].map((x,i)=>({q:x[0],a:x[1],topic:i<10?0:i<17?1:i<26?2:3,id:i}));let deck=[...cards],pos=0,flipped=false,marked={};const $=id=>document.getElementById(id);function render(){const c=deck[pos];$('cardtext').textContent=flipped?c.a:c.q;$('side').textContent=(flipped?'ОТГОВОР':'ВЪПРОС')+' • '+(pos+1)+' от '+deck.length;$('card').classList.toggle('answer',flipped);$('flip').textContent=flipped?'Покажи въпроса':'Покажи отговора';const done=deck.filter(x=>marked[x.id]).length;const yes=deck.filter(x=>marked[x.id]==='yes').length;$('stats').textContent='Прегледани: '+done+'/'+deck.length+' • Знам: '+yes+' • За преговор: '+(done-yes);$('bar').style.width=(100*done/deck.length)+'%'}function move(n){pos=(pos+n+deck.length)%deck.length;flipped=false;render()}function flip(){flipped=!flipped;render()}$('card').onclick=flip;$('card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};$('flip').onclick=flip;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);function mark(value){marked[deck[pos].id]=value;move(1)}$('known').onclick=()=>mark('yes');$('unknown').onclick=()=>mark('no');$('topic').onchange=()=>{const v=$('topic').value;deck=cards.filter(x=>v==='all'||x.topic===Number(v));pos=0;flipped=false;render()};$('shuffle').onclick=()=>{for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}pos=0;flipped=false;render()};$('reset').onclick=()=>{marked={};pos=0;flipped=false;render()};render();</script></body></html>
